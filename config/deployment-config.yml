# =====================================================================
# FUENTE DE VERDAD de la configuración del despliegue (RF-12, P8).
# La guía humana para aplicarla: docs/guia-lanzamiento.md
# Fase 2 (RF-F2-03): aplicar este archivo automáticamente vía API.
# Visibilidades: publico | protegido (Ayudantes verificados + admins) | solo_admin
# OJO (ADR-006): Ushahidi tiene UN solo nivel real de privacidad, gobernado por el
# permiso «Manage Posts». En la plataforma alojada, `protegido` y `solo_admin` se
# aplican igual; la distinción queda documentada para el día que autoalojemos.
# =====================================================================

despliegue:
  nombre: "SOS Sismo Colombia — Ayuda ciudadana"
  url: "https://sos-sismo-colombia.ushahidi.io/"   # backend Ushahidi: de aquí salen los scripts (base_api). NO cambiar por el dominio propio.
  url_publica: "https://www.sossismocolombia.com.co/"   # cara pública (ADR-010): es el enlace que se difunde
  idioma: es
  zona_horaria: America/Bogota
  mapa:
    centro: { lat: 5.0, lng: -76.2 }
    zoom: 7   # abarca Chocó, Valle del Cauca, Risaralda, Quindío y Caldas
    # hOSM = Humanitarian OpenStreetMap: única capa SIN clave de Mapbox, y la
    # mejor para zonas rurales en crisis. Las demás (streets, satellite) usan la
    # cuenta compartida de Ushahidi, que hoy devuelve 403. Ver ADR-009.
    capa_base: hOSM
    autoencuadrar: false   # con 0 publicaciones el autoencuadre ignora el centro
  publicacion_instantanea: true   # RF-02: desactivar la aprobación previa
  ocultar_autor: true             # P2: el nombre de quien publica no se muestra
  # RNF-06: la línea 123 va primero, antes que nada.
  # OJO: dentro de un bloque « > » no existen los comentarios — un « # algo » al
  # final de una línea es TEXTO y viaja a la descripción pública del despliegue.
  # Pasó: la descripción vivió con un « # RNF-06 » pegado al final (corregido el
  # 12-ago-2026). Los comentarios de este bloque van aquí arriba.
  # El aviso «hay réplicas: si tu casa está dañada, no vuelvas a entrar» se retiró
  # el 12-ago-2026: quien llega aquí ya sabe que tiembla, y advertirle sobre su
  # propia casa desde una pantalla suena a regaño justo cuando viene a pedir ayuda.
  descripcion_publica: >
    ⚠️ ¿Hay una vida en riesgo ahora? Llama primero a la línea de emergencias
    123. Esta plataforma es ciudadana y complementa a los organismos de
    socorro: publica aquí tu solicitud —o la de otra persona que no pueda
    hacerlo— para que la ayuda sepa dónde ir. Tu teléfono y tu dirección
    exacta nunca son públicos: solo los ven ayudantes verificados por el
    equipo. Nunca te pediremos dinero, claves ni números de cuenta. Es
    gratuito. Sin internet, envía un SMS al 3148071191.

# SIN EMOJI a propósito (ADR-007): Ushahidi valida los nombres de categoría y de
# encuesta contra /^[\pL\pN\pP ]+$/u — letras, números, puntuación y espacios.
# Los emoji sí se conservan en etiquetas de campo, opciones y textos de ayuda.
categorias:
  - "Rescate — persona atrapada"
  - "Atención médica / paramédicos"
  - "Medicamentos"
  - "Comida y agua"
  - "Refugio / alojamiento"
  - "Maquinaria / remoción de escombros"
  - "Transporte / evacuación"
  - "Seguridad / Policía"
  - "Búsqueda de familiares"
  # «Iluminación / energía» se retiró el 11-ago-2026 (RF-14): hace falta luz en toda
  # la zona, así que la marcaría casi todo el mundo y no ordenaría el triaje, lo
  # saturaría. Sigue existiendo como opción de «Qué ofreces» en «Ofrezco recursos».
  # En el despliegue vivo quedó creada (id 11) y sin usar: borrarla es manual.
  #
  # T-035 (RF-22): al contrario que la anterior, esta SÍ discrimina — dice que el
  # problema no es lo que falta sino que no se puede llegar, y eso cambia quién
  # tiene que ir y en qué. Sin ella, «vía bloqueada» acababa escrito a mano en la
  # descripción, donde no se puede filtrar ni contar.
  - "Vía bloqueada / acceso"
  - "Otro"

# =====================================================================
# LA SEÑAL DE VERIFICACIÓN (RF-17, ADR-017).
# Comprobado contra el despliegue vivo el 11-ago-2026:
#   - POST /api/v5/posts es anónimo -> cualquiera con curl puede enviarse a sí
#     mismo «Verificación: ✔️ Verificada por el equipo». Devuelve 201 y lo guarda.
#   - `sets` se IGNORA en ese POST, y POST /api/v5/collections/{id}/posts
#     responde 401 sin token.
# Por eso la insignia del mapa se lee de la colección y NUNCA del campo. El campo
# se conserva porque el equipo lo usa en su panel, pero la cara pública no lo mira.
# =====================================================================
colecciones:
  - nombre: "Verificadas por el equipo"
    vista: map
    descripcion: >
      Solo el equipo mete publicaciones aquí, y es la única señal de verificación
      que reconoce la cara pública. Meter una publicación equivale a decir «llamamos
      y el caso es real»: no se hace por si acaso.

roles:
  - id: administrador
    tipo: nativo
  - id: ayudante_verificado
    tipo: personalizado
    otorgado_por: "el equipo, tras llamada de confirmación — nunca automático (RF-08, ADR-005)"
    permisos:
      - ver_campos_protegidos          # se marca campo por campo en la interfaz
      - gestionar_publicaciones        # para actualizar Estado; revocable si la red crece

encuestas:

  pido_ayuda:
    titulo: "Pido ayuda"                # sin emoji: ADR-007
    campos_nativos:
      titulo:      { etiqueta: "¿Qué está pasando? (en una frase)" }
      descripcion: { etiqueta: "Cuéntanos más" }
    campos:
      - { etiqueta: "¿Para quién pides ayuda?", tipo: opcion_unica, opciones: ["Para mí", "Para otra persona"], obligatorio: true, visibilidad: publico }
      - { etiqueta: "Nombre o apodo", tipo: texto_corto, obligatorio: true, visibilidad: publico, ayuda: "No necesitas tu nombre completo." }
      - { etiqueta: "¿Qué necesitas?", tipo: casillas_categorias, obligatorio: true, visibilidad: publico, ayuda: "Marca todas las que apliquen." }
      - { etiqueta: "Urgencia", tipo: opcion_unica, opciones: ["🔴 CRÍTICA: vidas en riesgo ahora", "🟠 ALTA: necesito ayuda hoy", "🟡 MEDIA: puede esperar 1–2 días"], obligatorio: true, visibilidad: publico }
      - { etiqueta: "¿Cuántas personas necesitan ayuda?", tipo: numero, obligatorio: true, visibilidad: publico }
      - { etiqueta: "¿Hay personas vulnerables?", tipo: casillas, opciones: ["Bebés o niños", "Adultos mayores", "Heridos", "Personas con discapacidad", "Embarazo"], obligatorio: false, visibilidad: publico }
      # OJO: el texto de ayuda de un campo ya creado NO se reconcilia (ADR-019 solo
      # añade campos y opciones). Estos dos se suavizaron el 12-ago-2026 y en el
      # despliegue vivo siguen los originales; el front los corrige con TEXTOS de
      # `web/lib/ushahidi.ts`, igual que la etiqueta del correo en T-022. Lo de aquí
      # es lo que se lleva quien replique desde cero.
      - { etiqueta: "Ubicación (punto en el mapa)", tipo: ubicacion, obligatorio: true, visibilidad: publico, ayuda: "Marca tu barrio o tu vereda, no tu casa exacta. La dirección precisa va en el siguiente campo, que es privado." }
      - { etiqueta: "Municipio y departamento", tipo: texto_corto, obligatorio: true, visibilidad: publico, ayuda: "Ej.: San José del Palmar, Chocó." }
      - { etiqueta: "Dirección exacta y señas", tipo: texto_largo, obligatorio: true, visibilidad: protegido, ayuda: "Solo la verán ayudantes verificados por el equipo. Da señas claras: color de la casa, referencias, piso." }
      - { etiqueta: "Teléfono de contacto", tipo: texto_corto, obligatorio: false, visibilidad: protegido, ayuda: "Opcional. Solo lo verán ayudantes verificados por el equipo; si lo escribes, autorizas que te llamen." }  # ADR-004
      # RF-19: la ayuda de este campo invitaba a publicar «el número de un familiar
      # fuera de la zona» —el teléfono de una tercera persona que no dio permiso, en
      # un campo que ve cualquiera, y que es la materia prima de la estafa que sigue
      # a un desastre. El front lo muestra reescrito (ver TEXTOS en web/lib/ushahidi.ts)
      # y manda a la API la etiqueta original, que no se puede renombrar sin borrar la
      # encuesta con sus publicaciones dentro. Al recrear el despliegue desde cero:
      # cambiar la ayuda aquí y quitar el override.
      - { etiqueta: "Otra forma de contacto (pública)", tipo: texto_corto, obligatorio: false, visibilidad: publico, ayuda: "Ej.: usuario de Instagram/X/Facebook, o el número de un familiar fuera de la zona." }
      - { etiqueta: "Foto", tipo: imagen, obligatorio: false, visibilidad: publico, ayuda: "Solo si tu señal lo permite." }
      # ------------------------------------------------------------------
      # T-034 (RF-22): lo que necesita quien va en camino y ninguna dirección
      # da. Todos opcionales y PÚBLICOS a propósito: esto no es contacto, es
      # logística, y sirve precisamente a quien todavía no ha llegado.
      # El front los agrupa y los pliega bajo «Solo si tu zona es de difícil
      # acceso» (Ushahidi no tiene grupos de campos; ver Formulario.tsx).
      # ------------------------------------------------------------------
      - { etiqueta: "Cómo se llega", tipo: opcion_unica, opciones: ["Carretera", "Solo por río", "Solo a pie", "Necesita helicóptero", "No sé"], obligatorio: false, visibilidad: publico }
      - { etiqueta: "Punto de referencia comunitario", tipo: texto_corto, obligatorio: false, visibilidad: publico, ayuda: "La escuela, la cancha, la iglesia, el puente. Este campo es público, así que la dirección de tu casa va mejor en el campo con candado." }
      - { etiqueta: "¿Hay dónde aterrizar cerca?", tipo: opcion_unica, opciones: ["Sí", "No", "No sé"], obligatorio: false, visibilidad: publico, ayuda: "Una cancha, un potrero plano o una vía ancha sin cables sirven." }
      - { etiqueta: "Tiempo desde el pueblo más cercano", tipo: texto_corto, obligatorio: false, visibilidad: publico, ayuda: "Ej.: 3 horas a pie desde Nóvita." }
      - { etiqueta: "¿La vía está bloqueada?", tipo: opcion_unica, opciones: ["Sí", "No", "No sé"], obligatorio: false, visibilidad: publico }
      - { etiqueta: "Estado de la solicitud", tipo: opcion_unica, opciones: ["🕐 Pendiente", "🚧 En atención", "✅ Resuelta"], defecto: "🕐 Pendiente", obligatorio: true, visibilidad: publico, ayuda: "Lo actualiza el equipo." }
      - { etiqueta: "Verificación", tipo: opcion_unica, opciones: ["Sin verificar", "✔️ Verificada por el equipo"], defecto: "Sin verificar", obligatorio: true, visibilidad: publico }

  busco_familiar:
    titulo: "Busco a un familiar"       # sin emoji: ADR-007
    # La plataforma exige Título y Descripción nativos en toda encuesta:
    # absorben los dos primeros campos (mismas etiquetas y ayudas).
    campos_nativos:
      titulo:      { etiqueta: "Nombre de la persona buscada", ayuda: "Si es menor de edad, escribe solo el nombre de pila." }
      descripcion: { etiqueta: "Descripción física y ropa", obligatorio: false }
    campos:
      - { etiqueta: "Edad aproximada", tipo: numero, obligatorio: false, visibilidad: publico }
      - { etiqueta: "Último lugar donde se le vio (mapa)", tipo: ubicacion, obligatorio: true, visibilidad: publico, ayuda: "Punto aproximado." }
      - { etiqueta: "Detalles del último contacto", tipo: texto_largo, obligatorio: false, visibilidad: publico, ayuda: "Fecha, hora, con quién estaba." }
      - { etiqueta: "Foto", tipo: imagen, obligatorio: false, visibilidad: publico, ayuda: "Si es menor de edad, NO publiques foto: el equipo te contactará para gestionarla en privado." }
      - { etiqueta: "Tu parentesco", tipo: texto_corto, obligatorio: false, visibilidad: publico }
      - { etiqueta: "Tu teléfono", tipo: texto_corto, obligatorio: false, visibilidad: protegido, ayuda: "Solo lo verán ayudantes verificados." }
      - { etiqueta: "Estado de la búsqueda", tipo: opcion_unica, opciones: ["🔍 Buscando", "✅ Localizada"], defecto: "🔍 Buscando", obligatorio: true, visibilidad: publico }
    nota_publica: >
      Recomienda registrar el caso también en el programa de Restablecimiento
      del Contacto entre Familiares de la Cruz Roja Colombiana. Esta plataforma
      complementa, no reemplaza, los canales oficiales.

  quiero_ayudar:
    titulo: "Quiero ayudar"             # sin emoji: ADR-007
    aprobacion_previa: true             # RF-16, ADR-016: solo la ve el equipo
    visibilidad_de_todos_los_campos: solo_admin   # RF-08 (aplica a los campos de abajo)
    # El Título y la Descripción nativos son SIEMPRE públicos en la plataforma:
    # se etiquetan para que nadie ponga ahí datos personales (P2).
    campos_nativos:
      titulo:      { etiqueta: "Título público (ej.: «Ofrezco rescate — Quibdó»)", ayuda: "NO escribas aquí tu nombre completo ni tu teléfono: van abajo, en campos que solo ve el equipo." }
      descripcion: { etiqueta: "Detalles públicos de lo que ofreces (sin datos personales)", obligatorio: false }
    campos:
      - { etiqueta: "Nombre completo", tipo: texto_corto, obligatorio: true }
      - { etiqueta: "Organización (o «voluntario independiente»)", tipo: texto_corto, obligatorio: true }
      - { etiqueta: "Teléfono", tipo: texto_corto, obligatorio: true }
      - { etiqueta: "Municipios donde puedes actuar", tipo: texto_corto, obligatorio: true }
      - { etiqueta: "Qué ofreces", tipo: casillas, opciones: ["Rescate", "Médico", "Transporte", "Maquinaria", "Alimentos", "Refugio", "Comunicaciones", "Otro"], obligatorio: true }
      # RF-15: el texto engaña —en la cara pública nadie crea cuenta— pero la etiqueta
      # NO se renombra aquí: la encuesta ya existe con ayudantes dentro y renombrarla
      # exige borrarla y rehacerla. El front la muestra como «Tu correo» (ver TEXTOS
      # en web/lib/ushahidi.ts) y envía a la API la original. Al recrear el despliegue
      # desde cero: renombrar aquí y quitar el override.
      - { etiqueta: "Correo con el que creaste tu cuenta aquí", tipo: texto_corto, obligatorio: true, ayuda: "Para asignarte el rol tras la llamada de verificación." }
    reglas_para_ayudantes:
      - "Direcciones y teléfonos son confidenciales: prohibido sacarlos de la operación."
      - "Al tomar un caso, cámbialo a «En atención»."
      - "Al terminarlo, márcalo «Resuelta»."
      - "Jamás pedir dinero ni datos bancarios a los afectados."

  ofrezco_recursos:                     # RF-14, ADR-015
    titulo: "Ofrezco recursos"          # sin emoji: ADR-007
    aprobacion_previa: true             # RF-16, ADR-016: solo la ve el equipo
    campos_nativos:
      titulo:      { etiqueta: "Título público (ej.: «Retroexcavadora — Pereira»)", ayuda: "NO escribas aquí tu nombre ni tu teléfono: van abajo, en campos que solo ve el equipo." }
      descripcion: { etiqueta: "Detalle del recurso (sin datos personales)", obligatorio: false, ayuda: "Ej.: retroexcavadora sobre orugas; 2 plantas de 5 kW; 40 cascos; camión de 10 t. La maquinaria solo entra a un punto de rescate cuando un organismo de socorro lo solicita: un mal movimiento puede costar una vida." }
    campos:
      - { etiqueta: "Qué ofreces", tipo: casillas, opciones: ["Maquinaria amarilla", "Planta eléctrica o combustible", "Iluminación", "Herramienta especializada", "Transporte", "Dron con cámara", "Alimentos o agua en volumen", "Otro"], obligatorio: true, visibilidad: publico }
      - { etiqueta: "Municipio donde está el recurso", tipo: texto_corto, obligatorio: true, visibilidad: publico }
      - { etiqueta: "Ubicación aproximada", tipo: ubicacion, obligatorio: false, visibilidad: publico, ayuda: "Punto aproximado; sirve para asignarte al frente más cercano." }
      - { etiqueta: "Disponibilidad", tipo: opcion_unica, opciones: ["🟢 Inmediata", "🕐 En unas horas", "🌅 Mañana"], obligatorio: true, visibilidad: publico }
      - { etiqueta: "Estado del recurso", tipo: opcion_unica, opciones: ["🟢 Disponible", "🔵 Asignado", "⚪ Retirado"], defecto: "🟢 Disponible", obligatorio: true, visibilidad: publico, ayuda: "Lo actualiza el equipo al asignarlo. El front lo oculta y lo envía por código (ADR-011)." }
      - { etiqueta: "Nombre de contacto", tipo: texto_corto, obligatorio: true, visibilidad: protegido }
      - { etiqueta: "Teléfono", tipo: texto_corto, obligatorio: true, visibilidad: protegido, ayuda: "Solo lo verán el equipo y los ayudantes verificados, para coordinar la asignación." }

# Encuestas que NO son nuestras pero existen en el despliegue (T-045, RF-20).
# Se declaran aquí para que la auditoría pública distinga «encuesta vista y
# consentida» de «encuesta que nadie ha revisado»: sin esta lista, cualquier
# encuesta viva que no esté arriba hace fallar la auditoría, que es justo lo que
# queremos. Borrarlas no es opción: se llevaría sus publicaciones por delante
# (ADR-019), y durante la emergencia no se borra nada (RNF-04).
encuestas_de_fabrica:
  - nombre: "Basic Post"
    # La trae Ushahidi al crear el despliegue. Comprobado el 12-ago-2026: aunque
    # `aplicar_config.py` la deja en `disabled: true`, SIGUE saliendo en
    # /api/v5/surveys para un anónimo, y venía con `hide_author: false` — la
    # única del despliegue que no ocultaba al autor. Se le fuerza el ocultado.
    motivo: "viene de fábrica con el despliegue; desactivada y fuera de uso"
    ocultar_autor: true

sms:
  fuente: SMSSync          # la fuente de datos de Ushahidi; la app del mismo nombre NO se usa (ADR-018)
  numero: "3148071191"   # SIM local Claro, activa desde el 11-ago-2026 (T-012)
  # La pasarela es cualquier app de Android que hable este protocolo. La app SMSsync
  # de Ushahidi (v3.1.1, feb-2017, targetSdk 22) NO se instala en Android 14+.
  pasarela:
    endpoint: "https://sos-sismo-colombia.api.ushahidi.io/sms/smssync"
    metodo: POST
    campos:                # verificados contra SMSSyncController.php de ushahidi/platform
      secret:         "la clave definida en Configuración → Fuentes de datos → SMSSync"
      from:           "número del remitente"
      message:        "texto del SMS"
      sent_to:        "3148071191"
      sent_timestamp: "epoch en MILISEGUNDOS (el servidor divide entre 1000)"
    respuesta_ok: '{"payload":{"success":true,"error":null}}'
    apps_candidatas: ["MacroDroid", "Tasker", "Automate"]
    requisitos_del_telefono:
      - "wifi o datos estables, fuera de la zona afectada, enchufado a corriente"
      - "excluir la app de la optimización de batería, o Android la duerme"
      - "la SIM necesita saldo o plan de SMS salientes para la respuesta automática"
  respuesta_automatica: >
    Recibimos tu mensaje y ya es visible para los equipos de ayuda. Si puedes,
    envía otro SMS con: municipio, barrio y cuántas personas son.
  formato_difundido: "AYUDA + qué necesitas + cuántas personas + municipio y barrio"

respaldos:
  frecuencia: "mínimo 2 veces al día"
  formato: CSV
  destino: "dos ubicaciones seguras FUERA de este repositorio (P2)"

difusion:
  mensaje_whatsapp: >
    🆘 SISMO COLOMBIA — Si necesitas ayuda (rescate, médicos, comida, refugio)
    o buscas a un familiar, repórtalo aquí:
    https://www.sossismocolombia.com.co/ · Sin internet, envía un SMS al
    3148071191 con: AYUDA + qué necesitas + cuántas personas + municipio y
    barrio. Tu teléfono y dirección exacta NO se publican. Es gratuito.
    Comparte 🙏
  destinatarios_prioritarios:
    - "PMU: Bogotá, Cali, Armenia, Quibdó"
    - "UNGRD"
    - "Cruz Roja Colombiana"
    - "Defensa Civil"
    - "Bomberos"
    - "Alcaldías de municipios afectados (Chocó, Caldas, Valle, Risaralda, Quindío)"
    - "Emisoras comunitarias y radio local (que lean el número SMS al aire)"
